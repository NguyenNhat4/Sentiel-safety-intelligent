# Self-contained local-only Docker Compose stack with disposable PostgreSQL.
# R2 is configured only in managed environments; local snapshots use ./data.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: p047_local
      POSTGRES_USER: p047
      POSTGRES_PASSWORD: p047-local-only
    volumes:
      - p047_local_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      CORS_ORIGINS: http://localhost:8000
      DATABASE_URL: postgresql+psycopg2://p047:p047-local-only@db:5432/p047_local
      DATABASE_FALLBACK_ENABLED: "false"
      RUN_DB_MIGRATIONS_ON_START: "true"
      SNAPSHOT_STORAGE_BACKEND: filesystem
      SNAPSHOT_DIR: data/snapshots
      OPERATIONAL_METRICS_LOG_PATH: data/operational-metrics.jsonl
      PERSON_MODEL_PATH: models/yolo11n.pt
      PPE_MODEL_PATH: models/ppe_yolov8n.pt
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; health=json.load(urllib.request.urlopen('http://localhost:8000/health')); assert health['ready']"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

volumes:
  p047_local_postgres_data:
