# Local container run uses the developer environment, with an isolated
# PostgreSQL URL so application checks never target a developer's configured DB.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: p047_compose_test
      POSTGRES_USER: p047_test
      POSTGRES_PASSWORD: p047-test-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.development
    environment:
      DATABASE_URL: postgresql+psycopg2://p047_test:p047-test-only@db:5432/p047_compose_test
      RUN_DB_MIGRATIONS_ON_START: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; health=json.load(urllib.request.urlopen('http://localhost:8000/health')); assert health['ready']"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
