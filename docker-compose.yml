services:
  backend:
    image: p047-mvp:${APP_VERSION:-local}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: .env.production
        required: false
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; health=json.load(urllib.request.urlopen('http://localhost:8000/health')); assert health['ready']"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
