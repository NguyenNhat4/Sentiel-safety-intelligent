# Local container run uses the developer environment, with an isolated
# PostgreSQL URL so application checks never target a developer's configured DB.
services:
  mediamtx:
    image: bluenviron/mediamtx:1.20.1
    volumes:
      - ./streamer/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "8888:8888"
    expose:
      - "8554"
      - "9997"
      - "9998"
    restart: unless-stopped

  streamer:
    build:
      context: .
      dockerfile: streamer/Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ./data/streamer:/app/data/streamer
    environment:
      MEDIA_RTSP_ENABLED: "true"
      MEDIA_RTSP_ORIGIN: rtsp://p047_local_publisher:p047_local_only_change_me@mediamtx:8554
      MEDIA_PUBLIC_ORIGIN: ${MEDIA_PUBLIC_ORIGIN:-http://localhost:8888}
    depends_on:
      - mediamtx
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: p047_compose_test
      POSTGRES_USER: p047_test
      POSTGRES_PASSWORD: p047-test-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_STREAMER_URL: ${VITE_STREAMER_URL:-}
        VITE_MEDIA_PUBLIC_ORIGIN: ${MEDIA_PUBLIC_ORIGIN:-http://localhost:8888}
        VITE_STREAM_TRANSPORT: ${VITE_STREAM_TRANSPORT:-hls}
    env_file:
      - .env.development
    environment:
      DATABASE_URL: postgresql+psycopg2://p047_test:p047-test-only@db:5432/p047_compose_test
      RUN_DB_MIGRATIONS_ON_START: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; health=json.load(urllib.request.urlopen('http://localhost:8000/health')); assert health['ready']"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
