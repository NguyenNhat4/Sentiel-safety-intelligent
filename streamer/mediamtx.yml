logLevel: info
api: yes
apiAddress: :9997
metrics: yes
metricsAddress: :9998

rtsp: yes
rtspTransports: [tcp]
hls: yes
hlsAddress: :8888
hlsAllowOrigins: ['*']
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 2s
hlsPartDuration: 200ms
webrtc: no

authMethod: internal
authInternalUsers:
  - user: p047_local_publisher
    pass: p047_local_only_change_me
    permissions:
      - action: publish
        path: ~^cameras/[A-Za-z0-9_-]+$
  - user: any
    pass:
    permissions:
      - action: read
        path: ~^cameras/[A-Za-z0-9_-]+$
      - action: playback
        path: ~^cameras/[A-Za-z0-9_-]+$

pathDefaults:
  source: publisher

paths:
  ~^cameras/[A-Za-z0-9_-]+$: {}
