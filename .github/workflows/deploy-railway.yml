name: Deploy Railway

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy and verify production
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Redeploy the published Docker image
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
          RAILWAY_ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT }}
        run: npx --yes @railway/cli@latest redeploy --yes --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENVIRONMENT"
      - name: Wait for ready health
        env:
          PROD_BASE_URL: ${{ secrets.PROD_BASE_URL }}
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent --show-error "$PROD_BASE_URL/health" | jq --exit-status '.ready == true' >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          exit 1
